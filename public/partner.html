<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Панель фулфилмента</title>
  <style>
    /* ==== ОБЩИЕ СТИЛИ ==== */
    :root {
      --bg: #0f0f0f;
      --surface: #1c1c1e;
      --surface2: #2c2c2e;
      --border: #38383a;
      --text: #f5f5f5;
      --text2: #98989e;
      --blue: #2aabee;
      --blue-hover: #1d94d4;
      --green: #34c759;
      --red: #ff3b30;
      --orange: #ff9500;
      --radius: 14px;
      --shadow: 0 2px 12px rgba(0,0,0,0.3);
    }

    * { box-sizing:border-box; margin:0; padding:0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    .partner {
      max-width: 720px;
      margin: 0 auto;
      padding: 20px 16px 40px;
    }

    /* ==== ШАПКА ==== */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 20px;
    }
    .header h1 { font-size:22px; font-weight:700; }
    .header .subtitle { font-size:13px; color:var(--text2); margin-top:2px; }
    .btn-logout {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--red);
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 13px;
      cursor: pointer;
      transition: background .15s;
    }
    .btn-logout:hover { background: rgba(255,59,48,0.1); }

    /* ==== ВКЛАДКИ ==== */
    .tabs {
      display: flex;
      background: var(--surface);
      border-radius: 12px;
      padding: 4px;
      margin-bottom: 20px;
      gap: 4px;
    }
    .tab-btn {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      background: transparent;
      color: var(--text2);
      transition: all .2s;
    }
    .tab-btn.active { background: var(--blue); color: #fff; }
    .tab-btn:hover:not(.active) { color: var(--text); }

    /* ==== ТАБЛИЦА ЗАЯВОК ==== */
    .order-count { font-size:13px; color:var(--text2); margin-bottom:12px; display:block; }
    table { width:100%; border-collapse:collapse; }
    th { text-align:left; padding:10px 8px; font-size:12px; color:var(--text2); font-weight:500; border-bottom:1px solid var(--border); }
    td { padding:10px 8px; font-size:13px; border-bottom:1px solid rgba(255,255,255,0.04); }
    .action-select { padding:6px 8px; border-radius:8px; border:1px solid var(--border); background:var(--surface2); color:var(--text); font-size:12px; }
    .no-orders { text-align:center; color:var(--text2); padding:40px 0; font-size:14px; }

    /* ==== ФОРМА МАРШРУТА (BlaBlaCar-style) ==== */
    .route-form {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: var(--shadow);
    }
    .route-form h3 { font-size:16px; font-weight:600; margin-bottom:16px; color:var(--text); }

    /* Переключатель Ищу/Везу */
    .direction-toggle {
      display: flex;
      background: var(--surface2);
      border-radius: 10px;
      padding: 3px;
      margin-bottom: 16px;
    }
    .dir-option {
      flex: 1;
      padding: 10px 8px;
      text-align: center;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      color: var(--text2);
      transition: all .2s;
      border: none;
      background: transparent;
    }
    .dir-option.active-seek { background: rgba(255,59,48,0.15); color: var(--red); font-weight:600; }
    .dir-option.active-drive { background: rgba(52,199,89,0.15); color: var(--green); font-weight:600; }
    .dir-option .emoji { font-size: 18px; display: block; margin-bottom: 2px; }

    /* Города + дата в одну строку */
    .route-search-row {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }
    .route-search-row .field {
      flex: 1;
      min-width: 120px;
    }
    .route-search-row .field-arrow {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      padding: 0 4px;
      color: var(--text2);
      font-size: 18px;
    }
    .field label {
      display: block;
      font-size: 11px;
      color: var(--text2);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
      font-weight: 500;
    }
    .field input, .field select {
      width: 100%;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface2);
      color: var(--text);
      font-size: 14px;
      outline: none;
      transition: border-color .2s;
    }
    .field input:focus, .field select:focus { border-color: var(--blue); }
    .field input::placeholder { color: var(--text2); }

    /* Маркетплейсы */
    .mkt-row {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }
    .mkt-chip {
      padding: 7px 13px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text2);
      transition: all .2s;
    }
    .mkt-chip.selected-wb { background: rgba(139,111,230,0.2); border-color:#8b6fe6; color:#c4b5ff; }
    .mkt-chip.selected-ozon { background: rgba(0,91,255,0.2); border-color:#005bff; color:#6ba3ff; }
    .mkt-chip.selected-yandex { background: rgba(252,224,0,0.15); border-color:#fce000; color:#fce000; }
    .mkt-chip.selected-other { background: rgba(255,255,255,0.06); border-color:#666; color:#ccc; }

    /* Груз */
    .cargo-row {
      display: flex;
      gap: 12px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }
    .cargo-field {
      flex: 1;
      min-width: 130px;
    }
    .cargo-field label {
      display: block;
      font-size: 12px;
      color: var(--text2);
      margin-bottom: 4px;
    }
    .cargo-field input {
      width: 100%;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface2);
      color: var(--text);
      font-size: 14px;
      outline: none;
    }

    /* Контакты */
    .contact-row {
      display: flex;
      gap: 12px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }
    .contact-row .field { flex:1; min-width:140px; }

    /* Кнопка */
    .btn-submit {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: var(--blue);
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background .2s;
    }
    .btn-submit:hover { background: var(--blue-hover); }
    .btn-submit:disabled { opacity: 0.4; cursor: not-allowed; }

    .msg-error { color:var(--red); font-size:13px; margin-top:8px; display:none; }
    .msg-success { color:var(--green); font-size:13px; margin-top:8px; display:none; }

    /* ==== КАРТОЧКИ МАРШРУТОВ ==== */
    .route-card {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 16px 18px;
      margin-bottom: 10px;
      box-shadow: var(--shadow);
      transition: transform .15s;
      cursor: default;
    }
    .route-card:active { transform: scale(0.99); }

    .route-card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 8px;
      gap: 10px;
    }
    .route-direction-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
    }
    .badge-drive { background: rgba(52,199,89,0.15); color: var(--green); }
    .badge-seek { background: rgba(255,149,0,0.15); color: var(--orange); }

    .route-route {
      font-size: 16px;
      font-weight: 600;
      letter-spacing: -0.2px;
    }
    .route-arrow { color: var(--text2); margin:0 6px; }

    .route-date {
      font-size: 12px;
      color: var(--text2);
      margin-top: 2px;
    }

    .route-card-bottom {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      flex-wrap: wrap;
      gap: 8px;
    }
    .route-cargo-detail {
      font-size: 13px;
      color: var(--text2);
    }
    .route-partner {
      font-size: 12px;
      color: var(--text2);
    }
    .route-contact-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 3px;
    }
    .route-contact-right a {
      color: var(--blue);
      text-decoration: none;
      font-size: 13px;
      font-weight: 500;
    }
    .route-contact-right .phone-text { color: var(--text2); font-size: 12px; }
    .btn-delete-route {
      background: transparent;
      border: none;
      color: var(--red);
      font-size: 18px;
      cursor: pointer;
      padding: 2px 8px;
      opacity: 0.5;
      transition: opacity .15s;
    }
    .btn-delete-route:hover { opacity: 1; }

    .mkt-badge {
      display: inline-block;
      padding: 2px 7px;
      border-radius: 5px;
      font-size: 11px;
      font-weight: 600;
      margin-left: 4px;
    }
    .mkt-wb { background: rgba(139,111,230,0.2); color: #b89fff; }
    .mkt-ozon { background: rgba(0,91,255,0.2); color: #6ba3ff; }
    .mkt-yandex { background: rgba(252,224,0,0.15); color: #fce000; }
    .mkt-other { background: rgba(255,255,255,0.06); color: #aaa; }

    .no-routes {
      text-align: center;
      color: var(--text2);
      padding: 48px 20px;
    }
    .no-routes .icon { font-size: 40px; margin-bottom: 12px; }
    .no-routes .text { font-size: 15px; }

    /* Фильтр маршрутов */
    .filter-tabs {
      display: flex;
      gap: 6px;
      margin-bottom: 14px;
    }
    .filter-tab {
      padding: 7px 16px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text2);
      transition: all .2s;
    }
    .filter-tab.active { background: var(--blue); color: #fff; border-color: var(--blue); }
    .filter-tab:hover:not(.active) { border-color: var(--text2); }

    /* Кнопки +/- */
    .stepper {
      display: flex;
      align-items: center;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--surface2);
      overflow: hidden;
    }
    .stepper button {
      width: 40px;
      height: 40px;
      border: none;
      background: transparent;
      color: var(--blue);
      font-size: 20px;
      font-weight: 600;
      cursor: pointer;
      transition: background .15s;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .stepper button:hover { background: rgba(42,171,238,0.1); }
    .stepper button:active { background: rgba(42,171,238,0.2); }
    .stepper input {
      width: 50px;
      text-align: center;
      border: none;
      background: transparent;
      color: var(--text);
      font-size: 16px;
      font-weight: 600;
      outline: none;
      -moz-appearance: textfield;
    }
    .stepper input::-webkit-outer-spin-button,
    .stepper input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  </style>
</head>
<body>
  <div class="partner">
    <!-- Шапка -->
    <div class="header">
      <div>
        <h1 id="partner-title">📦 Загрузка...</h1>
        <p class="subtitle" id="partner-subtitle"></p>
      </div>
      <button class="btn-logout" onclick="logout()">Выйти</button>
    </div>

    <!-- Вкладки -->
    <div class="tabs">
      <button class="tab-btn active" id="tab-orders-btn" onclick="switchTab('orders')">📦 Заявки</button>
      <button class="tab-btn" id="tab-routes-btn" onclick="switchTab('routes')">🚚 Маршруты</button>
    </div>

    <!-- Заявки -->
    <div id="tab-orders">
      <span class="order-count" id="order-count"></span>
      <table>
        <thead><tr><th>ID</th><th>Имя</th><th>Телефон</th><th>Ссылка</th><th>Статус</th><th>Дата</th></tr></thead>
        <tbody id="orders-table"></tbody>
      </table>
    </div>

    <!-- Маршруты -->
    <div id="tab-routes" style="display:none">
      <!-- Форма BlaBlaCar-style -->
      <div class="route-form">
        <!-- Переключатель -->
        <div class="direction-toggle">
          <button class="dir-option active-seek" id="dir-seek" onclick="setDirection('ищет')">
            <span class="emoji">📦</span> Ищу перевозку
          </button>
          <button class="dir-option" id="dir-drive" onclick="setDirection('везет')">
            <span class="emoji">🚛</span> Везу
          </button>
        </div>

        <!-- Откуда → Куда → Дата -->
        <div class="route-search-row">
          <div class="field">
            <label>Откуда</label>
            <select id="rt-from"><option value="">Город</option></select>
          </div>
          <div class="field-arrow">→</div>
          <div class="field">
            <label>Куда</label>
            <select id="rt-to"><option value="">Город</option></select>
          </div>
          <div class="field" style="max-width:150px">
            <label>Дата</label>
            <input type="date" id="rt-date" min="">
          </div>
        </div>

        <!-- Маркетплейсы -->
        <div class="mkt-row" id="rt-mkt">
          <span class="mkt-chip" onclick="toggleMkt(this,'WB')">🟣 WB</span>
          <span class="mkt-chip" onclick="toggleMkt(this,'Ozon')">🔵 Ozon</span>
          <span class="mkt-chip" onclick="toggleMkt(this,'Yandex')">🟡 Яндекс</span>
          <span class="mkt-chip" onclick="toggleMkt(this,'Другое')">⚪ Другое</span>
        </div>

        <!-- Груз -->
        <div class="cargo-row">
          <div class="cargo-field">
            <label id="lbl-pallets">Нужно отвезти поддонов, шт</label>
            <div class="stepper">
              <button onclick="stepCargo('rt-pallets', -1)">−</button>
              <input type="number" id="rt-pallets" min="0" value="0" readonly>
              <button onclick="stepCargo('rt-pallets', 1)">+</button>
            </div>
          </div>
          <div class="cargo-field">
            <label id="lbl-boxes">Нужно отвезти коробок 60×40×40, шт</label>
            <div class="stepper">
              <button onclick="stepCargo('rt-boxes', -1)">−</button>
              <input type="number" id="rt-boxes" min="0" value="0" readonly>
              <button onclick="stepCargo('rt-boxes', 1)">+</button>
            </div>
          </div>
        </div>

        <!-- Контакты -->
        <div class="contact-row">
          <div class="field">
            <label>Telegram</label>
            <input type="text" id="rt-tg" placeholder="@username">
          </div>
          <div class="field">
            <label>Телефон</label>
            <input type="tel" id="rt-phone" placeholder="+7 900 000-00-00">
          </div>
        </div>

        <button class="btn-submit" onclick="createRoute()">Опубликовать</button>
        <div class="msg-error" id="rt-error"></div>
        <div class="msg-success" id="rt-success"></div>
      </div>

      <!-- Список -->
      <!-- Фильтр -->
      <div class="filter-tabs" id="route-filter">
        <button class="filter-tab active" onclick="filterRoutes('all', this)">Все</button>
        <button class="filter-tab" onclick="filterRoutes('ищет', this)">📦 Ищут перевозку</button>
        <button class="filter-tab" onclick="filterRoutes('везет', this)">🚛 Везут</button>
      </div>
      <div id="routes-list"></div>
    </div>
  </div>
  <script src="partner.js"></script>
</body>
</html>
