<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SellFull</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0d0d0d;color:#e0e0e0;padding:16px}
    h2{color:#4da3ff;margin-bottom:8px}
    p.sub{color:#999;font-size:13px;margin-bottom:12px}
    .card{background:#1a1a1a;border:1px solid #333;border-radius:12px;padding:14px;margin-bottom:8px;cursor:pointer;display:flex;align-items:center;gap:12px}
    .card:active{background:#2a2a2a}
    .flag{font-size:28px}
    .name{font-size:16px;font-weight:600}
    .info{font-size:12px;color:#777}
    .back{color:#4da3ff;font-size:14px;background:none;border:none;padding:0;margin-bottom:8px;cursor:pointer}
    input,select{width:100%;background:#1a1a1a;border:1px solid #333;border-radius:8px;padding:10px;color:#e0e0e0;font-size:15px;margin-bottom:8px}
    .btn{width:100%;background:#4da3ff;color:#fff;border:none;border-radius:8px;padding:12px;font-size:15px;font-weight:600;cursor:pointer;margin-top:4px}
    .btn:active{opacity:0.8}
    .hidden{display:none}
    #status{padding:12px;border-radius:8px;margin-top:12px;font-size:13px}
    #status.ok{background:#0a2a0a;color:#4caf50}
    #status.err{background:#2a0a0a;color:#f44336}
    .method-row{display:flex;gap:8px;margin-bottom:12px}
    .method-row button{flex:1;padding:8px;border-radius:8px;border:1px solid #333;background:#1a1a1a;color:#999;font-size:14px;cursor:pointer}
    .method-row button.on{background:#4da3ff;color:#fff;border-color:#4da3ff}
  </style>
</head>
<body>

<div id="countries">
  <h2>🌍 Выберите страну</h2>
  <p class="sub">Подберём склад фулфилмента</p>
  <div id="country-list">Загрузка...</div>
</div>

<div id="cities" class="hidden">
  <button class="back" onclick="showStep('countries')">← Назад</button>
  <h2>📍 Выберите город</h2>
  <p class="sub">Введите название или выберите из списка</p>
  <input type="text" placeholder="🔍 Поиск города..." oninput="filterCities(this.value)">
  <div id="city-list"></div>
</div>

<div id="zones" class="hidden">
  <button class="back" onclick="showStep('cities')">← Назад</button>
  <h2>📍 Уточните район</h2>
  <div id="zone-list"></div>
</div>

<div id="form" class="hidden">
  <button class="back" onclick="showStep('zones')">← Назад</button>
  <h2>📦 Заявка на фулфилмент</h2>
  <p class="sub" id="form-addr"></p>
  <div class="method-row">
    <button class="on" data-m="FBO" onclick="setMethod('FBO',this)">📦 FBO</button>
    <button data-m="FBS" onclick="setMethod('FBS',this)">🚚 FBS</button>
  </div>
  <input type="text" id="order-name" placeholder="Ваше имя" required>
  <input type="tel" id="order-phone" placeholder="Телефон" required>
  <input type="text" id="order-link" placeholder="Ссылка на товар (WB)" required>
  <button class="btn" onclick="submitOrder()">Отправить заявку</button>
  <div id="status" class="hidden"></div>
</div>

<div id="success" class="hidden" style="text-align:center;padding-top:40px">
  <h2 style="font-size:24px;color:#4caf50">✅ Заявка отправлена!</h2>
  <p class="sub">Скоро с вами свяжется менеджер</p>
  <button class="btn" onclick="resetForm()" style="width:200px;margin:20px auto">Новая заявка</button>
</div>

<script>
// Init Telegram
if (window.Telegram && window.Telegram.WebApp) {
  window.Telegram.WebApp.ready();
  window.Telegram.WebApp.expand();
}

var citiesData = [], country = null, city = null, zone = null, method = "FBO";
var COUNTRIES = [
  {name:"Россия",flag:"🇷🇺"},{name:"Китай",flag:"🇨🇳"},{name:"Казахстан",flag:"🇰🇿"},
  {name:"Киргизия",flag:"🇰🇬"},{name:"Армения",flag:"🇦🇲"}
];

fetch("/api/cities").then(function(r){return r.json()}).then(function(d){
  citiesData = d;
  var html = "";
  COUNTRIES.forEach(function(c){
    var n = citiesData.filter(function(x){return x.country===c.name}).length;
    html += "<div class=card onclick='pickCountry(\""+c.name+"\")'><span class=flag>"+c.flag+"</span><div><div class=name>"+c.name+"</div><div class=info>"+n+" городов</div></div></div>";
  });
  document.getElementById("country-list").innerHTML = html || "Нет данных";
});

function pickCountry(name){
  country = name;
  document.getElementById("city-list").innerHTML = "";
  filterCities("");
  showStep("cities");
}

function filterCities(q){
  q = (q||"").toLowerCase();
  var f = citiesData.filter(function(c){return c.country===country && c.name.toLowerCase().indexOf(q)>=0});
  if(!f.length){ document.getElementById("city-list").innerHTML="<div class=info style='text-align:center;padding:20px'>Ничего не найдено</div>"; return; }
  document.getElementById("city-list").innerHTML = f.map(function(c){
    return "<div class=card onclick='pickCity("+JSON.stringify(c.key)+",\""+c.name+"\","+JSON.stringify(c.zones||null)+")'><div><div class=name>"+c.name+"</div><div class=info>"+(c.zones?c.zones.length+" зоны":"")+"</div></div></div>";
  }).join("");
}

function pickCity(key,name,zones){
  city = {key:key,name:name,zones:zones};
  if(zones && zones.length){
    zone = null;
    document.getElementById("zone-list").innerHTML = zones.map(function(z){
      return "<div class=card onclick='pickZone(\""+z+"\")'><div class=name>"+z+"</div><div class=info>"+name+"</div></div>";
    }).join("");
    showStep("zones");
  } else {
    zone = "";
    showForm();
  }
}

function pickZone(z){ zone=z; showForm(); }

function showForm(){
  document.getElementById("form-addr").textContent = city.name + (zone?(" — "+zone):"");
  showStep("form");
}

function setMethod(m,el){
  method=m;
  document.querySelectorAll(".method-row button").forEach(function(b){b.classList.toggle("on",b===el)});
}

function submitOrder(){
  var name = document.getElementById("order-name").value.trim();
  var phone = document.getElementById("order-phone").value.trim();
  var link = document.getElementById("order-link").value.trim();
  if(!name||!phone||!link){ showStatus("Заполните все поля","err"); return; }
  
  var btn = document.querySelector("#form .btn");
  btn.disabled = true; btn.textContent = "Отправка...";
  
  fetch("/api/order",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:name,phone:phone,link:link,city:city.key,zone:zone,method:method})})
    .then(function(r){return r.json()})
    .then(function(d){
      if(d.ok){ showStep("success"); }
      else { showStatus(d.error||"Ошибка","err"); btn.disabled=false; btn.textContent="Отправить заявку"; }
    })
    .catch(function(){ showStatus("Ошибка соединения","err"); btn.disabled=false; btn.textContent="Отправить заявку"; });
}

function showStatus(msg,cls){
  var s=document.getElementById("status");
  s.textContent=msg; s.className=cls; s.classList.remove("hidden");
}

function showStep(s){
  ["countries","cities","zones","form","success"].forEach(function(id){document.getElementById(id).classList.add("hidden")});
  document.getElementById(s).classList.remove("hidden");
}

function resetForm(){
  document.getElementById("order-name").value="";
  document.getElementById("order-phone").value="";
  document.getElementById("order-link").value="";
  document.getElementById("status").classList.add("hidden");
  city=null;zone=null;country=null;
  showStep("countries");
}
</script>
</body>
</html>
